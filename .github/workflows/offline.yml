name: offline

# Офлайн-пакет для Windows: архив update site + install.cmd (p2 director из состава DBeaver).
# Проверяется на настоящем DBeaver CE для Windows: сначала ставится старая версия плагина,
# затем install.cmd обновляет её до выбранного релиза.
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Релиз плагина, из которого берётся архив update site'
        default: v2.2.0
      old_tag:
        description: 'Старый релиз, поверх которого проверяется обновление'
        default: v2.1.0
      dbeaver_version:
        description: 'Версия DBeaver CE для Windows'
        default: 26.2.1

jobs:
  package:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Download plugin releases
        run: |
          mkdir -p dl/new dl/old
          gh release download "${{ inputs.release_tag }}" --pattern '*-site-*.zip' --dir dl/new
          gh release download "${{ inputs.release_tag }}" --pattern '*.jar' --dir dl/new
          gh release download "${{ inputs.old_tag }}" --pattern '*-site-*.zip' --dir dl/old
          ls -l dl/new dl/old

      - name: Download DBeaver CE for Windows
        run: |
          V="${{ inputs.dbeaver_version }}"
          gh release view "$V" --repo dbeaver/dbeaver --json assets -q '.assets[].name' | tee assets.txt
          ASSET=$(grep -iE '^dbeaver-ce-.*win.*(x86_64|amd64|x64).*\.zip$' assets.txt | head -1)
          [ -n "$ASSET" ] || { echo "::error::нет zip для Windows: $(tr '\n' ' ' < assets.txt)"; exit 1; }
          echo "asset: $ASSET"
          gh release download "$V" --repo dbeaver/dbeaver --pattern "$ASSET" --output dbeaver.zip
          7z x -y -oC:/dbv dbeaver.zip >/dev/null
          ls C:/dbv
          D=$(dirname "$(find C:/dbv -maxdepth 2 -name dbeaver.exe | head -1)")
          echo "DBV=$D" >> "$GITHUB_ENV"

      - name: Install old version (as Install New Software would)
        shell: cmd
        run: |
          for %%F in (%GITHUB_WORKSPACE%\dl\old\*.zip) do set "OLD=%%~fF"
          set "OLD=%OLD:\=/%"
          for %%F in ("%DBV%\plugins\org.eclipse.equinox.launcher_*.jar") do set "L=%%~fF"
          set "DBV=%DBV:/=\%"
          set "PROFILE=DefaultProfile"
          for /f "tokens=2 delims==" %%P in ('findstr /B /C:"eclipse.p2.profile=" "%DBV%\configuration\config.ini"') do set "PROFILE=%%P"
          echo profile=%PROFILE%
          cd /d "%DBV%"
          "%DBV%\jre\bin\java.exe" -jar "%L%" -nosplash -consoleLog -application org.eclipse.equinox.p2.director ^
            -destination "%DBV%" -bundlepool "%DBV%" -profile %PROFILE% -p2.os win32 -p2.ws win32 -p2.arch x86_64 ^
            -repository "jar:file:/%OLD%!/" ^
            -installIU dbeaver.openwebui.ai.feature.feature.group,io.dbtools.openwebui.feature.feature.group
          findstr /I openwebui "%DBV%\configuration\org.eclipse.equinox.simpleconfigurator\bundles.info"

      - name: Assemble offline package
        run: |
          VER="${{ inputs.release_tag }}"; VER="${VER#v}"
          P="dbeaver-openwebui-ai-offline-$VER"
          mkdir -p "pkg/$P/plugins"
          cp dl/new/*-site-*.zip "pkg/$P/dbeaver-openwebui-ai-site-$VER.zip"
          cp dl/new/*.jar "pkg/$P/plugins/"
          cp releng/offline/install.cmd releng/offline/УСТАНОВКА.txt "pkg/$P/"
          sed -i "s/2\.2\.0\.v[0-9]*/$(basename dl/new/dbeaver.openwebui.ai_*.jar .jar | sed 's/.*_//')/g; s/2\.2\.0/$VER/g" "pkg/$P/УСТАНОВКА.txt"
          sed -i "s/site-2\.2\.0\.zip/site-$VER.zip/; s/engine 2\.2\.0/engine $VER/" "pkg/$P/install.cmd"
          echo "PKG=$P" >> "$GITHUB_ENV"

      - name: Upgrade with install.cmd
        shell: cmd
        env:
          OPENWEBUI_NOPAUSE: '1'
        run: |
          call "%GITHUB_WORKSPACE%\pkg\%PKG%\install.cmd" "%DBV%"
          if errorlevel 1 exit /b 1

      - name: Diagnostics
        if: always()
        run: |
          set +o pipefail
          ls -la "$DBV/configuration"
          for f in "$DBV"/configuration/*.log; do echo "== $f"; head -40 "$f"; done
          echo "== plugins"; ls "$DBV/plugins" | grep -i openwebui || true
          echo "== features"; ls "$DBV/features" | grep -i openwebui || true

      - name: Verify result
        run: |
          BI="$DBV/configuration/org.eclipse.equinox.simpleconfigurator/bundles.info"
          grep -i openwebui "$BI"
          VER="${{ inputs.release_tag }}"; VER="${VER#v}"
          grep -q "^dbeaver.openwebui.ai,$VER" "$BI" || { echo "::error::$VER не установлена"; exit 1; }
          grep -q "^dbeaver.openwebui.ai,$VER[^,]*,plugins/" "$BI" || { echo "::error::плагин лежит не в plugins/"; exit 1; }
          J=$(grep "^dbeaver.openwebui.ai,$VER" "$BI" | cut -d, -f3); [ -f "$DBV/$J" ] || { echo "::error::нет файла $J"; exit 1; }
          ls "$DBV"/plugins | grep openwebui
          echo "bundles: $(wc -l < "$BI")"; [ "$(wc -l < "$BI")" -gt 300 ] || { echo "::error::bundles.info обеднел"; exit 1; }
          grep eclipse.p2.profile "$DBV/configuration/config.ini" || true
          if grep -i openwebui "$BI" | grep -v ",$VER\." ; then echo "::error::остались старые версии"; exit 1; fi

      - name: Second run (reinstall over the same version)
        shell: cmd
        env:
          OPENWEBUI_NOPAUSE: '1'
        run: |
          call "%GITHUB_WORKSPACE%\pkg\%PKG%\install.cmd" "%DBV%"
          if errorlevel 1 exit /b 1

      - name: Zip package
        run: cd pkg && 7z a "../$PKG.zip" "$PKG" >/dev/null && ls -l ..

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PKG }}
          path: ${{ env.PKG }}.zip
