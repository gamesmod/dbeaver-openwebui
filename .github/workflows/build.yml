name: build

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      dbeaver_version:
        description: 'Версия DBeaver CE 26.2+ для основного бандла (например 26.2.1). Пусто — последний релиз.'
        required: false
      release_tag:
        description: 'Выпустить релиз: тег v<версия> (= Bundle-Version). Тег и релиз создаются автоматически.'
        required: false

permissions:
  contents: write

env:
  # Совместимый бандл собирается против этой версии (поддержка 25.2.4–25.2.5)
  DBEAVER25_VERSION: 25.2.4

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      dbeaver: ${{ steps.dbv.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Resolve DBeaver version
        id: dbv
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.dbeaver_version }}
        run: |
          V="${INPUT_VERSION:-$(gh release view --repo dbeaver/dbeaver --json tagName -q .tagName)}"
          echo "DBeaver CE $V, совместимый бандл: $DBEAVER25_VERSION"
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Cache DBeaver
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/dbeaver
            ${{ runner.temp }}/dbeaver25
          key: dbeaver-ce-${{ steps.dbv.outputs.version }}-${{ env.DBEAVER25_VERSION }}-linux

      - name: Download DBeaver CE
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./scripts/get-dbeaver.sh "${{ steps.dbv.outputs.version }}" "$RUNNER_TEMP/dbeaver"
          ./scripts/get-dbeaver.sh "$DBEAVER25_VERSION" "$RUNNER_TEMP/dbeaver25"
          ls "$RUNNER_TEMP/dbeaver/plugins" | grep -E 'dbeaver.(model|ui).ai_'
          ls "$RUNNER_TEMP/dbeaver25/plugins" | grep -E 'dbeaver.(model|ui).ai_'

      - name: Tests
        run: DBEAVER_HOME="$RUNNER_TEMP/dbeaver" ./scripts/run-tests.sh

      # Компиляция идёт против настоящих jar DBeaver обеих версий — это проверка совместимости с их API.
      - name: Build plugins and update site
        run: DBEAVER_HOME="$RUNNER_TEMP/dbeaver" DBEAVER25_HOME="$RUNNER_TEMP/dbeaver25" ./scripts/build-offline.sh

      # Чистая установка через InstallOperation (как мастер Install New Software): на каждой версии DBeaver
      # должен встать свой бандл.
      - name: Install check — DBeaver ${{ steps.dbv.outputs.version }}
        run: ./scripts/upgrade-test.sh "$RUNNER_TEMP/dbeaver" none - "$(ls "$PWD"/dist/*-site-*.zip)" dbeaver.openwebui.ai

      - name: Install check — background chats add-on, DBeaver ${{ steps.dbv.outputs.version }}
        env:
          INSTALL_IUS: dbeaver.openwebui.ai.feature.feature.group,io.dbtools.openwebui.feature.feature.group,dbeaver.openwebui.ai.async.feature.feature.group
          EXPECT_ALSO: dbeaver.openwebui.ai.async
        run: ./scripts/upgrade-test.sh "$RUNNER_TEMP/dbeaver" none - "$(ls "$PWD"/dist/*-site-*.zip)" dbeaver.openwebui.ai

      - name: Install check — DBeaver ${{ env.DBEAVER25_VERSION }}
        run: ./scripts/upgrade-test.sh "$RUNNER_TEMP/dbeaver25" none - "$(ls "$PWD"/dist/*-site-*.zip)" dbeaver.openwebui.ai.compat25

      - uses: actions/upload-artifact@v4
        with:
          name: dbeaver-openwebui-ai
          path: dist/*

  # Обновление поверх предыдущих версий: 2.0.2 (из релиза) и 1.0.2 (собирается из тега v1.0.2)
  upgrade:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/dbeaver
            ${{ runner.temp }}/dbeaver25
          key: dbeaver-ce-${{ needs.build.outputs.dbeaver }}-${{ env.DBEAVER25_VERSION }}-linux

      - name: Download DBeaver CE
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./scripts/get-dbeaver.sh "${{ needs.build.outputs.dbeaver }}" "$RUNNER_TEMP/dbeaver"
          ./scripts/get-dbeaver.sh "$DBEAVER25_VERSION" "$RUNNER_TEMP/dbeaver25"

      - uses: actions/download-artifact@v4
        with:
          name: dbeaver-openwebui-ai
          path: dist

      - name: Upgrade from 2.0.2
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v2.0.2 --repo "$GITHUB_REPOSITORY" --pattern '*-site-*.zip' --dir "$RUNNER_TEMP/old202"
          ./scripts/upgrade-test.sh "$RUNNER_TEMP/dbeaver" "$(ls "$RUNNER_TEMP"/old202/*.zip)" \
            dbeaver.openwebui.ai.feature.feature.group "$(ls "$PWD"/dist/*-site-*.zip)" dbeaver.openwebui.ai

      - name: Upgrade from 1.0.2
        run: |
          git worktree add "$RUNNER_TEMP/v102" v1.0.2
          (cd "$RUNNER_TEMP/v102" && DBEAVER_HOME="$RUNNER_TEMP/dbeaver" ./scripts/build-offline.sh)
          ./scripts/upgrade-test.sh "$RUNNER_TEMP/dbeaver" "$(ls "$RUNNER_TEMP"/v102/dist/*-site-*.zip)" \
            io.dbtools.openwebui.feature.feature.group "$(ls "$PWD"/dist/*-site-*.zip)" dbeaver.openwebui.ai

  # Windows без интернета: офлайн-пакет (архив + install.cmd) на настоящем DBeaver CE для Windows.
  # Сначала ставится 2.2.0 из релиза, затем install.cmd обновляет до собранной версии.
  windows:
    needs: build
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: dbeaver-openwebui-ai
          path: dist

      - name: Download DBeaver CE ${{ needs.build.outputs.dbeaver }} for Windows and old plugin
        run: |
          V="${{ needs.build.outputs.dbeaver }}"
          gh release view "$V" --repo dbeaver/dbeaver --json assets -q '.assets[].name' > assets.txt
          ASSET=$(grep -iE '^dbeaver-ce-.*win.*(x86_64|amd64|x64).*\.zip$' assets.txt | head -1)
          [ -n "$ASSET" ] || { echo "::error::нет zip для Windows: $(tr '\n' ' ' < assets.txt)"; exit 1; }
          gh release download "$V" --repo dbeaver/dbeaver --pattern "$ASSET" --output dbeaver.zip
          7z x -y -oC:/dbv dbeaver.zip >/dev/null
          D=$(dirname "$(find C:/dbv -maxdepth 2 -name dbeaver.exe | head -1)")
          # путь с пробелами, как в Program Files
          mkdir -p "C:/Program Files/dbeaver test" && mv "$D" "C:/Program Files/dbeaver test/dbeaver-ce"
          echo "DBV=C:/Program Files/dbeaver test/dbeaver-ce" >> "$GITHUB_ENV"
          gh release download v2.2.0 --repo "$GITHUB_REPOSITORY" --pattern '*-site-*.zip' --dir old

      - name: Install old version 2.2.0
        shell: cmd
        run: |
          for %%F in (%GITHUB_WORKSPACE%\old\*.zip) do set "OLD=%%~fF"
          set "OLD=%OLD:\=/%"
          set "DBV=%DBV:/=\%"
          for %%F in ("%DBV%\plugins\org.eclipse.equinox.launcher_*.jar") do set "L=%%~fF"
          cd /d "%DBV%"
          "%DBV%\jre\bin\java.exe" -jar "%L%" -nosplash -application org.eclipse.equinox.p2.director ^
            -destination "%DBV%" -bundlepool "%DBV%" -profile DefaultProfile -p2.os win32 -p2.ws win32 -p2.arch x86_64 ^
            -repository "jar:file:/%OLD%!/" ^
            -installIU dbeaver.openwebui.ai.feature.feature.group,io.dbtools.openwebui.feature.feature.group
          if errorlevel 1 exit /b 1
          findstr /I openwebui "%DBV%\configuration\org.eclipse.equinox.simpleconfigurator\bundles.info"

      - name: Offline package
        run: |
          PKG=$(./scripts/make-offline-package.sh dist pkg)
          echo "PKG=$PKG" >> "$GITHUB_ENV"
          ls -l pkg

      # ComSpec подменён на curl: так было на машине пользователя (for /f и конвейеры запускали curl)
      - name: Upgrade with install.cmd
        shell: cmd
        env:
          OPENWEBUI_NOPAUSE: '1'
          ComSpec: C:\Windows\System32\curl.exe
        run: |
          call "%GITHUB_WORKSPACE%\%PKG:/=\%\install.cmd" "%DBV%" async
          if errorlevel 1 exit /b 1
          rem второй запуск без ключа: надстройка должна сохраниться
          call "%GITHUB_WORKSPACE%\%PKG:/=\%\install.cmd" "%DBV%"
          if errorlevel 1 exit /b 1

      - name: Verify result
        run: |
          BI="$DBV/configuration/org.eclipse.equinox.simpleconfigurator/bundles.info"
          grep -i openwebui "$BI"
          FULL=$(basename "$(ls dist/dbeaver-openwebui-ai-site-*.zip)" .zip); FULL=${FULL#dbeaver-openwebui-ai-site-}
          grep -q "^dbeaver.openwebui.ai,$FULL," "$BI" || { echo "::error::$FULL не установлена"; exit 1; }
          J=$(grep "^dbeaver.openwebui.ai,$FULL," "$BI" | cut -d, -f3); [ -f "$DBV/$J" ] || { echo "::error::нет файла $J"; exit 1; }
          [ "$(wc -l < "$BI")" -gt 300 ] || { echo "::error::bundles.info обеднел"; exit 1; }
          if grep -i openwebui "$BI" | grep -v ",$FULL," ; then echo "::error::остались старые версии"; exit 1; fi
          grep -q "^dbeaver.openwebui.ai.async,$FULL," "$BI" || { echo "::error::надстройка не установлена или удалена при повторном запуске"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: dbeaver-openwebui-ai-offline
          path: pkg/*.zip

  # Сквозная проверка надстройки в настоящем DBeaver: ожидание ответа, режим «не ждать», сохранение чатов,
  # доставка ответа после перезапуска (tests/async-uitest + scripts/ui-async-test.sh)
  ui-async:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install X tools and GTK/WebKit
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb xdotool openbox imagemagick libgtk-3-0t64 libwebkit2gtk-4.1-0 fonts-dejavu >/dev/null

      - uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/dbeaver
            ${{ runner.temp }}/dbeaver25
          key: dbeaver-ce-${{ needs.build.outputs.dbeaver }}-${{ env.DBEAVER25_VERSION }}-linux

      - name: Download DBeaver CE
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/get-dbeaver.sh "${{ needs.build.outputs.dbeaver }}" "$RUNNER_TEMP/dbeaver"

      - uses: actions/download-artifact@v4
        with:
          name: dbeaver-openwebui-ai
          path: dist

      - name: Install plugin, add-on and test bundle
        run: |
          D="$RUNNER_TEMP/dbeaver-ui"
          cp -r "$RUNNER_TEMP/dbeaver" "$D"
          ./scripts/p2.sh "$D" -repository "jar:file:$(ls "$PWD"/dist/*-site-*.zip)!/" \
            -installIU dbeaver.openwebui.ai.feature.feature.group,dbeaver.openwebui.ai.async.feature.feature.group
          T="$RUNNER_TEMP/uitest"; mkdir -p "$T/classes"
          CP="$(find "$D/plugins" -name '*.jar' | tr '\n' ':')$(ls dist/dbeaver.openwebui.ai_*.jar):$(ls dist/dbeaver.openwebui.ai.async_*.jar)"
          javac -encoding UTF-8 --release 21 -proc:none -nowarn -cp "$CP" -d "$T/classes" $(find tests/async-uitest/src -name '*.java')
          cp tests/async-uitest/plugin.xml "$T/classes/"
          jar cfm "$D/plugins/dbeaver.openwebui.async.uitest_1.0.0.jar" tests/async-uitest/META-INF/MANIFEST.MF -C "$T/classes" .
          echo "dbeaver.openwebui.async.uitest,1.0.0,plugins/dbeaver.openwebui.async.uitest_1.0.0.jar,4,false" \
            >> "$D/configuration/org.eclipse.equinox.simpleconfigurator/bundles.info"
          grep openwebui "$D/configuration/org.eclipse.equinox.simpleconfigurator/bundles.info"

      - name: Run DBeaver twice
        run: DBEAVER_HOME="$RUNNER_TEMP/dbeaver-ui" OUT="$RUNNER_TEMP/ui-async" ./scripts/ui-async-test.sh

      - name: Logs
        if: always()
        run: |
          ls -la "$RUNNER_TEMP/ui-async" "$RUNNER_TEMP/ui-async/ws/.metadata" || true
          grep -iE 'openwebui|uitest|exception|error' "$RUNNER_TEMP/ui-async/ws/.metadata/dbeaver-debug.log" | tail -80 || true
          grep -iE 'uitest|exception|error' "$RUNNER_TEMP/ui-async/phase1.log" | tail -40 || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-async-logs
          path: |
            ${{ runner.temp }}/ui-async/*.png
            ${{ runner.temp }}/ui-async/*.log
            ${{ runner.temp }}/ui-async/*.json
            ${{ runner.temp }}/ui-async/ws/.metadata/dbeaver-debug.log

  # Фоновые запросы против настоящего Open WebUI в Docker; в роли модели — tests/mock_owui.py
  openwebui-live:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ghcr.io/open-webui/open-webui:main
            required: true
          - image: ghcr.io/open-webui/open-webui:v0.10.2
            required: false
          - image: ghcr.io/open-webui/open-webui:v0.9.6
            required: false
          - image: ghcr.io/open-webui/open-webui:v0.8.12
            required: false
          - image: ghcr.io/open-webui/open-webui:v0.7.2
            required: false
          - image: ghcr.io/open-webui/open-webui:v0.6.43
            required: false
    continue-on-error: ${{ !matrix.required }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Start model mock and Open WebUI
        run: |
          MOCK_PORT=18081 python3 tests/mock_owui.py > mock.log 2>&1 &
          docker run -d --name owui --network host \
            -e PORT=8080 -e OPENAI_API_BASE_URL=http://127.0.0.1:18081/v1 -e OPENAI_API_KEY=sk-test \
            -e ENABLE_OLLAMA_API=false -e WEBUI_SECRET_KEY=ci-secret -e ENABLE_SIGNUP=true \
            -e OFFLINE_MODE=true -e RAG_EMBEDDING_MODEL_AUTO_UPDATE=false -e ENABLE_VERSION_UPDATE_CHECK=false \
            "${{ matrix.image }}"
          for i in $(seq 1 120); do
            curl -sf http://127.0.0.1:8080/health >/dev/null && break
            sleep 5
          done
          curl -sf http://127.0.0.1:8080/health || { docker logs owui | tail -100; exit 1; }
          docker exec owui sh -c 'cat /app/package.json 2>/dev/null | grep "\"version\"" || true'

      - name: Live test
        run: |
          TOKEN=$(curl -sf -X POST http://127.0.0.1:8080/api/v1/auths/signup -H 'Content-Type: application/json' \
            -d '{"name":"ci","email":"ci@example.com","password":"ci-password-1"}' | python3 -c 'import json,sys; print(json.load(sys.stdin)["token"])')
          curl -sf http://127.0.0.1:8080/api/models -H "Authorization: Bearer $TOKEN" | python3 -c 'import json,sys; print([m["id"] for m in json.load(sys.stdin)["data"]])'
          GSON=$(find ~/.m2 /usr/share -name 'gson-*.jar' 2>/dev/null | head -1)
          if [ -z "$GSON" ]; then
            curl -sfL -o gson.jar https://repo1.maven.org/maven2/com/google/code/gson/gson/2.11.0/gson-2.11.0.jar && GSON=$PWD/gson.jar
          fi
          mkdir -p out
          javac -encoding UTF-8 --release 21 -proc:none -nowarn -cp "$GSON" -d out \
            $(find tests/api-stubs bundles/dbeaver.openwebui.ai.async/src/dbeaver/openwebui/async/core tests/src-async -name '*.java')
          java -cp "out:$GSON" dbeaver.openwebui.async.core.AsyncLiveTest http://127.0.0.1:8080/api/ "$TOKEN" gpt-4o

      - name: Open WebUI log
        if: failure()
        run: docker logs owui 2>&1 | grep -v -E '"GET /api/(v1/chats|tasks)|Task IDs for chat' | tail -200

  release:
    needs: [build, upgrade, windows, openwebui-live, ui-async]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: dbeaver-openwebui-ai
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: dbeaver-openwebui-ai-offline
          path: dist

      - name: Check tag matches bundle versions
        env:
          TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.release_tag }}
        run: |
          for m in bundles/*/META-INF/MANIFEST.MF; do
            BV=$(sed -n 's/^Bundle-Version: \([0-9.]*\)\.qualifier.*/\1/p' "$m" | tr -d '\r')
            [ "${TAG#v}" = "$BV" ] || { echo "Тег $TAG не совпадает с Bundle-Version $BV в $m" >&2; exit 1; }
          done

      # В репозитории включены неизменяемые релизы: файлы нельзя добавить после публикации.
      # Поэтому релиз создаётся здесь сразу с архивами.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.release_tag }}
          DBV: ${{ needs.build.outputs.dbeaver }}
        run: |
          NOTES="Движок Open WebUI для AI-ассистента DBeaver.

          Собрано и проверено установкой на DBeaver CE ${DBV} и ${DBEAVER25_VERSION}, а также обновлением с 2.0.2 и 1.0.2.
          Установка: Help → Install New Software… → Add… → Archive… → \`dbeaver-openwebui-ai-site-*.zip\`, отметить категорию *Open WebUI* целиком.
          Без интернета: в том же окне снимите галочку *Contact all update sites during install to find required software*. Marketplace не нужен.
          \`dbeaver-openwebui-ai-offline-*.zip\` — то же для Windows без интернета: архив, install.cmd и инструкция УСТАНОВКА.txt (проверено на DBeaver CE ${DBV} для Windows)."
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Релиз $TAG уже существует, а опубликованные релизы неизменяемы. Выпустите новую версию." >&2
            exit 1
          fi
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "$TAG" --notes "$NOTES" --latest
