name: build

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      dbeaver_version:
        description: 'Версия DBeaver CE (например 26.2.1). Пусто — последний релиз.'
        required: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Плагин использует AI API DBeaver 26.2+, поэтому по умолчанию собираем против последнего релиза CE.
      - name: Resolve DBeaver version
        id: dbv
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.dbeaver_version }}
        run: |
          V="${INPUT_VERSION:-$(gh release view --repo dbeaver/dbeaver --json tagName -q .tagName)}"
          echo "DBeaver CE $V"
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Cache DBeaver
        id: dbeaver-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/dbeaver
          key: dbeaver-ce-${{ steps.dbv.outputs.version }}-linux

      - name: Download DBeaver CE ${{ steps.dbv.outputs.version }}
        if: steps.dbeaver-cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.dbv.outputs.version }}
        run: |
          # Имя архива ищем по списку файлов релиза, а не собираем вручную
          ASSET=$(gh release view "$V" --repo dbeaver/dbeaver --json assets -q '.assets[].name' \
            | grep -E '^dbeaver-ce-.*linux.*(x86_64|amd64).*\.tar\.gz$' | head -1)
          if [ -z "$ASSET" ]; then
            echo "В релизе $V нет архива для Linux x86_64. Файлы релиза:" >&2
            gh release view "$V" --repo dbeaver/dbeaver --json assets -q '.assets[].name' >&2
            exit 1
          fi
          echo "Скачиваю $ASSET"
          gh release download "$V" --repo dbeaver/dbeaver --pattern "$ASSET" --output dbeaver.tgz
          mkdir -p "$RUNNER_TEMP/unpack"
          tar xzf dbeaver.tgz -C "$RUNNER_TEMP/unpack"
          # Корневой каталог архива — тот, где лежит plugins/
          HOME_DIR=$(dirname "$(find "$RUNNER_TEMP/unpack" -maxdepth 3 -type d -name plugins | head -1)")
          mv "$HOME_DIR" "$RUNNER_TEMP/dbeaver"
          ls "$RUNNER_TEMP/dbeaver"

      - name: Check DBeaver AI extension points
        run: |
          P="$RUNNER_TEMP/dbeaver/plugins"
          MODEL_AI=$(ls "$P"/org.jkiss.dbeaver.model.ai_*.jar)
          UI=$(ls "$P"/org.jkiss.dbeaver.ui_*.jar)
          unzip -p "$MODEL_AI" plugin.xml | grep -q 'extension-point id="com.dbeaver.ai.engine"'
          unzip -p "$UI" plugin.xml | grep -q 'extension-point id="org.jkiss.dbeaver.ui.propertyConfigurator"'
          echo "OK: $(basename "$MODEL_AI"), $(basename "$UI")"

      - name: Tests
        run: DBEAVER_HOME="$RUNNER_TEMP/dbeaver" ./scripts/run-tests.sh

      # Компиляция идёт против настоящих jar DBeaver — это проверка совместимости с его API.
      - name: Build plugin and update site
        run: DBEAVER_HOME="$RUNNER_TEMP/dbeaver" ./scripts/build-offline.sh

      - name: Check installability with p2
        run: |
          cp -r "$RUNNER_TEMP/dbeaver" "$RUNNER_TEMP/dbeaver-check"
          cd "$RUNNER_TEMP/dbeaver-check"
          SITE=$(ls "$GITHUB_WORKSPACE"/dist/*-site-*.zip)
          jre/bin/java -jar plugins/org.eclipse.equinox.launcher_*.jar -nosplash \
            -application org.eclipse.equinox.p2.director \
            -repository "jar:file:${SITE}!/" \
            -installIU dbeaver.openwebui.ai.feature.feature.group
          grep -q '^dbeaver.openwebui.ai,' configuration/org.eclipse.equinox.simpleconfigurator/bundles.info

      - name: Check tag matches bundle version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          BV=$(sed -n 's/^Bundle-Version: \([0-9.]*\)\.qualifier.*/\1/p' bundles/dbeaver.openwebui.ai/META-INF/MANIFEST.MF | tr -d '\r')
          [ "$TAG" = "$BV" ] || { echo "Тег v$TAG не совпадает с Bundle-Version $BV" >&2; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: dbeaver-openwebui-ai
          path: dist/*

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          make_latest: true
          generate_release_notes: true
          body: |
            Движок Open WebUI для встроенного AI-ассистента DBeaver.
            Собрано и проверено установкой через p2 на DBeaver CE ${{ steps.dbv.outputs.version }}.
            Установка: Help → Install New Software… → Add… → Archive… → `dbeaver-openwebui-ai-site-*.zip`.
