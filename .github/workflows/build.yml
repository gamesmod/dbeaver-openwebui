name: build

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  # Версия DBeaver CE, против которой собирается и тестируется плагин.
  DBEAVER_VERSION: 25.3.0

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache DBeaver
        id: dbeaver-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/dbeaver
          key: dbeaver-ce-${{ env.DBEAVER_VERSION }}-linux

      - name: Download DBeaver CE ${{ env.DBEAVER_VERSION }}
        if: steps.dbeaver-cache.outputs.cache-hit != 'true'
        run: |
          curl -fsSL -o dbeaver.tgz \
            "https://github.com/dbeaver/dbeaver/releases/download/${DBEAVER_VERSION}/dbeaver-ce-${DBEAVER_VERSION}-linux.gtk.x86_64.tar.gz"
          tar xzf dbeaver.tgz -C "$RUNNER_TEMP"

      - name: Tests
        run: DBEAVER_HOME="$RUNNER_TEMP/dbeaver" ./scripts/run-tests.sh

      - name: Build plugin and update site
        run: DBEAVER_HOME="$RUNNER_TEMP/dbeaver" ./scripts/build-offline.sh

      - name: Check installability with p2
        run: |
          cp -r "$RUNNER_TEMP/dbeaver" "$RUNNER_TEMP/dbeaver-check"
          cd "$RUNNER_TEMP/dbeaver-check"
          SITE=$(ls "$GITHUB_WORKSPACE"/dist/*-site-*.zip)
          jre/bin/java -jar plugins/org.eclipse.equinox.launcher_*.jar -nosplash \
            -application org.eclipse.equinox.p2.director \
            -repository "jar:file:${SITE}!/" \
            -installIU io.dbtools.openwebui.feature.feature.group
          grep -q io.dbtools.openwebui configuration/org.eclipse.equinox.simpleconfigurator/bundles.info

      - uses: actions/upload-artifact@v4
        with:
          name: dbeaver-openwebui
          path: dist/*

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
