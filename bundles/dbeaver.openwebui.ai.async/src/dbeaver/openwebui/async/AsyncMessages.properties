placeholder=⏳ The answer is being generated in Open WebUI (request {0}). You can keep working — it will appear here automatically.
placeholder_link=Open the chat in Open WebUI
connection_lost=⏳ Open WebUI is not reachable. The answer keeps being generated on the server and will appear here when the connection is back.
error_prefix=Open WebUI could not answer:
not_supported=Background requests need Open WebUI itself (base URL ending with /api); the request was sent the usual way.

page_description=Background chats for the Open WebUI engine. Requests run as tasks on the Open WebUI server: generation goes on if DBeaver is closed or the network drops, and the answer is delivered into the chat later.
persist_label=Keep AI chats between DBeaver restarts
persist_tip=DBeaver Community keeps AI chats in memory only. With this option every conversation is saved to the workspace (.metadata/dbeaver-openwebui/chats) and the conversation list, history and deletion work as usual. Applies after reopening the AI chat panel.
mirror_label=Save chats in Open WebUI
mirror_tip=Every conversation with the Open WebUI engine gets its own chat in Open WebUI: it can be opened in the browser or on another computer. DBeaver is the source of truth: edits made in Open WebUI are not copied back.
background_label=Run requests in the background on the Open WebUI server
background_tip=The answer is generated by an Open WebUI task and stored in the chat on the server. Requires the base URL of Open WebUI itself (http://host:3000/api).
mode_group=While the answer is generated
mode_wait=Wait in the chat (the answer is shown as it is written)
mode_wait_tip=As usual: the chat is busy until the answer is finished. If DBeaver is closed meanwhile, the answer is delivered after the next start.
mode_detach=Do not wait: free the chat at once, the answer replaces a placeholder later
mode_detach_tip=The chat shows a placeholder and is free immediately: switch to other conversations, ask new questions. The answer replaces the placeholder when ready, also after a restart.
poll_label=Check for the answer every, seconds:
functions_note=In the background mode the model cannot call DBeaver functions (table lists, DDL, editor text): the server can not reach DBeaver. The database structure is sent with the request instead, as for engines without functions.
restart_note=Changes of the first option apply after reopening the AI chat panel.
pending_label=Answers in progress:
pending_none=none
pending_count={0}
