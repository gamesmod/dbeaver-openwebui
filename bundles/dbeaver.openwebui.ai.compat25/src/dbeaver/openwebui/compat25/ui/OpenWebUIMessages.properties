base_url_label = Base URL
base_url_tip = Open WebUI: http://host:3000/api. Any OpenAI Chat Completions server also works: http://host:8000/v1 (vLLM, LiteLLM, LM Studio, Ollama)
base_url_hint = If only the host is given (http://host:3000), /api is appended automatically.
token_label = API key
token_placeholder = sk-... (Open WebUI: Settings > Account > API Keys)
token_tip = Open WebUI API key or JWT token. Leave empty if authentication is disabled on the server.
url_required = Specify the base URL to load models
temperature_label = Temperature
temperature_tip = 0 - deterministic answers (recommended for SQL). Reasoning models that reject this parameter are retried without it.
streaming_label = Streaming responses
streaming_tip = Disable if a reverse proxy buffers Server-Sent Events
functions_label = Allow function calling (tools)
functions_tip = Lets the model read database metadata via DBeaver functions. The model must support native tool calling.
hide_thinking_label = Hide reasoning (<think>...</think>)
hide_thinking_tip = Remove reasoning blocks of DeepSeek-R1, Qwen3, QwQ and similar models from answers
headers_label = Extra HTTP headers
headers_tip = One header per line: Name: value (e.g. for Cloudflare Access or a corporate proxy)
meta_group = Metadata sent to the model
meta_info = Applied to every request of this profile before it is sent to Open WebUI. Data of tables is never sent by DBeaver; these options limit the structure description.
meta_hide_connection = Hide connection details (server version, connection name, driver)
meta_hide_connection_tip = SQL dialect and default schema are still sent: the model needs them to write correct SQL
meta_snapshot = Database snapshot:
meta_snapshot_full = Full (as DBeaver builds it)
meta_snapshot_names = Only catalog and schema names
meta_snapshot_none = Do not send
meta_snapshot_tip = Section of the system prompt with the scope structure. Without function calling it contains DDL of all tables of the scope.
meta_allow_ddl = Allow the model to read table DDL (function getTableDetails)
meta_allow_ddl_tip = When off, the model sees only schema and table names
meta_allow_editor = Allow the model to read the SQL editor text (function getCurrentScript)
meta_allow_editor_tip = The editor may contain literals with real data
meta_max_chars = Max metadata size (chars, 0 = no limit):
meta_max_chars_tip = Limits the DB snapshot and every function result
